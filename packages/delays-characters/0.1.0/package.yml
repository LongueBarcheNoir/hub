# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

# Supports type, tap, press, release, and sleep.

# For new scripts this file may be copied to the espanso/match directory and edited.

matches:
  - trigger: :delay    # Remember to include this value in Trig, below.
    replace: "{{Output}}"
    vars:
      - name: Trig
        type: echo
        params:
          echo: :delay # This MUST match the trigger text.
      - name: Input
        type: echo
        params:
          echo: |      # Amend the contents below to suit, adding variables etc.
            type Hello, World!
            tap enter
            type Pausing for one second
            tap enter
            sleep 1 
            type How are you?
            tap space
            press shift
            type I am a bot
            release shift
            tap enter
            type The trigger was "{{Trig}}"
            tap enter
            tap tab
            type The End.
      - name: Output
        type: script
        params:
          args:
            - python3
            - '%CONFIG%/match/packages/delays-characters/parse_pynput.py'
            - '--trig'
            - '{{Trig}}'
            - '{{Input}}'

  # Trigger to be called through the search bar only - no trigger replacement
  - trigger: "!send-keystrokes!"
    label: "Type random text, send CTRL+SHIFT+X to window then type text again."
    replace: "{{Output}}"
    vars:
      - name: Input
        type: echo
        params:
          echo: |      # Amend the contents below to suit, adding variables etc.
            type Typing stuff
            tap enter
            type Pausing for one second
            tap enter
            sleep 1
            type Sending 'Ctrl+Shift+X' to enable formatting options in Teams
            press ctrl
            press shift
            press x
            release x
            release shift
            release ctrl
            type _formatting text using MD syntax_
            tap enter
      - name: Output
        type: script
        params:
          args:
            - python3
            - '%CONFIG%/match/packages/delays-characters/parse_pynput.py' 
            - '{{Input}}'
